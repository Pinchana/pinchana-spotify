[project]
name = "pinchana-spotify"
version = "0.2b0"
description = "Spotify music downloader for Pinchana"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "fastapi>=0.141.1",
    "spotipy>=2.26.0",
    "uvicorn>=0.52.1",
    "ytmusicapi>=1.12.1",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
