[project]
name = "pinchana-spotify"
version = "26.10.2"
description = "Spotify music downloader for Pinchana"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "fastapi>=0.143.1",
    "spotipy>=2.26.0",
    "uvicorn>=0.54.0",
    "ytmusicapi>=1.12.3",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
